name: Build Zig Xtensa Toolchain

on:
  workflow_dispatch:
    inputs:
      zig_version:
        description: 'Zig version to build'
        required: true
        default: '0.14.0'
      upload_release:
        description: 'Upload as GitHub Release'
        type: boolean
        default: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install dependencies
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y cmake ninja-build clang lld llvm-dev libclang-dev

      - name: Checkout Zig source
        uses: actions/checkout@v4
        with:
          repository: ziglang/zig
          ref: ${{ github.event.inputs.zig_version }}
          path: zig

      - name: Checkout patches
        uses: actions/checkout@v4
        path: patches

      - name: Apply Xtensa patches
        run: |
          cd zig
          for patch in ../patches/patches/*.patch; do
            [[ -f "$patch" ]] || continue
            echo "Applying $(basename "$patch")..."
            git apply "$patch"
          done

      - name: Configure CMake
        run: |
          cd zig
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DZIG_TARGETS="Xtensa" \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/install" \
            -GNinja

      - name: Build Zig
        run: |
          cd zig
          cmake --build build --target install

      - name: Verify Xtensa support
        run: |
          cd zig
          ./install/bin/zig version
          ./install/bin/zig targets | grep -i xtensa

      - name: Package toolchain
        run: |
          cd zig
          tar -czf zig-xtensa-${{ runner.os }}-${{ runner.arch }}.tar.gz -C install .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zig-xtensa-linux-x86_64
          path: zig/zig-xtensa-Linux-x86_64.tar.gz

      - name: Create release
        if: github.event.inputs.upload_release == 'true' && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: zig-xtensa-${{ github.event.inputs.zig_version }}-${{ github.run_number }}
          name: Zig ${{ github.event.inputs.zig_version }}-xtensa
          files: zig/zig-xtensa-Linux-x86_64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Install dependencies
        run: |
          brew install cmake ninja llvm

      - name: Checkout Zig source
        uses: actions/checkout@v4
        with:
          repository: ziglang/zig
          ref: ${{ github.event.inputs.zig_version }}
          path: zig

      - name: Checkout patches
        uses: actions/checkout@v4
        path: patches

      - name: Apply Xtensa patches
        run: |
          cd zig
          for patch in ../patches/patches/*.patch; do
            [[ -f "$patch" ]] || continue
            echo "Applying $(basename "$patch")..."
            git apply "$patch"
          done

      - name: Configure CMake
        run: |
          cd zig
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DZIG_TARGETS="Xtensa" \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/install" \
            -GNinja

      - name: Build Zig
        run: |
          cd zig
          cmake --build build --target install

      - name: Verify Xtensa support
        run: |
          cd zig
          ./install/bin/zig version
          ./install/bin/zig targets | grep -i xtensa

      - name: Package toolchain
        run: |
          cd zig
          tar -czf zig-xtensa-${{ runner.os }}-${{ runner.arch }}.tar.gz -C install .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zig-xtensa-macos-${{ runner.arch }}
          path: zig/zig-xtensa-Darwin-*.tar.gz

      - name: Create release
        if: github.event.inputs.upload_release == 'true' && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: zig-xtensa-${{ github.event.inputs.zig_version }}-${{ github.run_number }}
          name: Zig ${{ github.event.inputs.zig_version }}-xtensa
          files: zig/zig-xtensa-Darwin-*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
